  <body>
    <div id="app"></div>
    <script>
      // Rescate: si la app no arranca (copia guardada rota tras una actualización), se borra la
      // copia sin conexión y se recarga una vez. La clave, el progreso y las entradas no se tocan.
      setTimeout(async function () {
        if (window.__nyc26_ok || sessionStorage.getItem('nyc26-rescate')) return;
        sessionStorage.setItem('nyc26-rescate', '1');
        try {
          var regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(function (r) { return r.unregister(); }));
          var ks = await caches.keys();
          await Promise.all(ks.filter(function (k) { return k.indexOf('nyc26-') === 0; }).map(function (k) { return caches.delete(k); }));
        } catch (e) {}
        location.reload();
      }, 8000);
    </script>
  </body>
